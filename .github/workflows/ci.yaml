name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI Package Typecheck
        run: pnpm --filter @eap/ai typecheck

      - name: AI Package Test
        run: pnpm --filter @eap/ai test

      - name: Lint
        run: pnpm --filter @eap/web lint

      - name: Typecheck
        run: pnpm --filter @eap/web typecheck

      - name: Build
        run: pnpm --filter @eap/web build

  backend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: services/business-api

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/business-api/go.mod
          cache-dependency-path: services/business-api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/server
