name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04

    # Migrations/test fixtures use the provisioner; runtime security tests create restricted logins.
    env:
      # Test-only encryption key; never use this key outside CI fixtures.
      AGENT_CHECKPOINT_KEY: "3333333333333333333333333333333333333333333333333333333333333333"
      EVAL_ALLOW_EXTERNAL: "false"
      EVAL_ALLOW_JUDGE: "false"
      DATABASE_URL: postgresql://eap:eap_test_password@localhost:5432/eap_test
      BETTER_AUTH_URL: http://localhost:3551
      BETTER_AUTH_SECRET: ci-only-secret-32-characters-not-for-production
      BUSINESS_API_KEY: ci-only-service-secret-32-characters-not-for-production
      TEST_DATABASE_URL: postgresql://eap:eap_test_password@localhost:5432/eap_test

    # Day 6: PostgreSQL Service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eap
          POSTGRES_PASSWORD: eap_test_password
          POSTGRES_DB: eap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eap -d eap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------
      # Day 2–5: AI Package
      # ------------------------------------

      - name: Observability Typecheck and Tests
        run: pnpm --filter @eap/observability typecheck && pnpm --filter @eap/observability test

      - name: AI Package Typecheck
        run: pnpm --filter @eap/ai typecheck

      - name: AI Package Test
        run: pnpm --filter @eap/ai test

      # ------------------------------------
      # Day 4–5: Tool Registry
      # ------------------------------------

      - name: Tool Registry Typecheck
        run: pnpm --filter @eap/tools typecheck

      - name: Tool Registry Tests
        run: pnpm --filter @eap/tools test

      # ------------------------------------
      # Day 6: Persistence
      # ------------------------------------

      - name: Persistence Typecheck
        run: pnpm --filter @eap/persistence typecheck

      - name: Database Migration
        run: pnpm --filter @eap/persistence db:migrate

      - name: Persistence and PostgreSQL RLS Security Tests
        run: pnpm --filter @eap/persistence test
        
      - name: Agent Worker Typecheck
        run: pnpm --filter @eap/agent-worker typecheck

      - name: Agent Worker Lease, Security and Durable Approval Integration Tests
        run: pnpm --filter @eap/agent-worker test

      - name: Evaluation Typecheck and Tests
        run: pnpm --filter @eap/evaluation typecheck && pnpm --filter @eap/evaluation test

      - name: Deterministic Agent Quality Gate
        run: pnpm eval:run --ci --dataset packages/evaluation/datasets/risk-v1.json --out artifacts/evaluation

      - name: Preserve Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-agent-evaluation
          path: artifacts/evaluation/
          if-no-files-found: warn

      # ------------------------------------
      # Next.js Web
      # ------------------------------------

      - name: Lint
        run: pnpm --filter @eap/web lint

      - name: Typecheck
        run: pnpm --filter @eap/web typecheck

      - name: Web Streaming, Approval API and Better Auth Integration Tests
        run: pnpm --filter @eap/web test

      - name: Build
        run: pnpm --filter @eap/web build

  backend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: services/business-api

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/business-api/go.mod
          cache-dependency-path: services/business-api/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/server