# Independent disposable test database; does not attach the existing postgres_data volume.
services:
  postgres-vector-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap_day13_test_password
      POSTGRES_DB: eap_test
    ports:
      - '127.0.0.1:5543:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eap -d eap_test']
      interval: 5s
      timeout: 3s
      retries: 20
