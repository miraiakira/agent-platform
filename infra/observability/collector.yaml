extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue:
      queue_size: 512
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 10s
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: false
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 2s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 10s
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
