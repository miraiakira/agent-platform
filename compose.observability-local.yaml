# LOCAL DEVELOPMENT ONLY. Never apply this override behind a public proxy/ingress.
# Keep Grafana's published port bound to 127.0.0.1 in compose.yaml.
services:
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
