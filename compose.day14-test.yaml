# Disposable reliability environment. Never mount postgres_data or a business volume here.
services:
  postgres-reliability:
    image: pgvector/pgvector:pg17
    cpus: 2
    mem_limit: 512m
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap_day14_test_password
      POSTGRES_DB: eap_test
    volumes:
      - day14_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5544:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eap -d eap_test']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  day14_data:
